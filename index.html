<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잠겨 버린 언어 연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 레이아웃: 비상 전원이 들어온 밝은 연구소. 상단 상태 바 + 로봇 온음의 말풍선 + 한 장면(평면도/방).
   불 꺼진 방은 회청색, 복구된 방은 따뜻한 전등색. 단일 밝은 테마로 의도적으로 고정. */
:root{
  color-scheme:light;
  --bg:#edf2f6; --wall:#ffffff; --wall-2:#f5f8fb; --line:#cfdae4; --ink:#1d2b3a; --muted:#5b6d7f;
  --amber:#a86300; --lamp:#ffb42a; --amber-soft:#fff2d6; --cyan:#147f99; --cyan-soft:#e2f3f7;
  --tag:#fff8e7; --tag-ink:#3b2f16; --tag-line:#ead9b2; --ok:#1c8655; --ok-soft:#e1f4ea; --bad:#c93a30; --bad-soft:#fdeceb;
  --dark-room:#dfe6ed; --shadow:0 1px 2px rgba(29,43,58,.06),0 6px 18px rgba(29,43,58,.07);
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-term:"Nanum Gothic Coding",ui-monospace,Menlo,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  background-image:linear-gradient(rgba(20,127,153,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(20,127,153,.06) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
.term{font-family:var(--f-term)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:12px 22px;background:var(--lamp);color:#2a1a00;font-family:var(--f-display);font-size:21px;box-shadow:0 2px 0 #d58d00}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--wall);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.panel{background:var(--wall);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--f-term);font-size:12px;letter-spacing:.14em;color:var(--amber)}

/* 상태 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1000px;margin:0 auto;padding:9px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.bar .name{font-family:var(--f-display);font-size:19px;margin-right:auto;color:var(--muted)}
.clock{font-family:var(--f-term);font-size:18px;font-variant-numeric:tabular-nums}
.pieces{display:flex;gap:6px;align-items:center}
.pieces small{font-size:12px;color:var(--muted);margin-right:2px}
.piece{width:32px;height:32px;border-radius:6px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:var(--muted);background:var(--wall-2)}
.piece.got{border:1.5px solid var(--tag-line);background:var(--tag);color:var(--tag-ink)}
.chip{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap;background:var(--wall)}
.chip b{font-weight:400;font-family:var(--f-display);font-size:16px;color:var(--amber)}
.chip.key{border-color:var(--lamp);background:var(--amber-soft);color:var(--amber)}
.nav{display:flex;gap:6px;align-items:center}
.tool{border:1px solid var(--line);background:var(--wall);border-radius:8px;padding:5px 10px;font-size:14px;white-space:nowrap}
.tool:hover{border-color:var(--cyan);color:var(--cyan)}
.teacher-flag{font-family:var(--f-term);font-size:12px;background:var(--lamp);color:#2a1a00;border-radius:6px;padding:2px 8px}

/* 로봇 온음 */
.onum{display:flex;gap:14px;align-items:center;margin-block:12px 16px;cursor:pointer}
.bot{flex:0 0 auto;width:78px;height:78px}
.bot svg{width:100%;height:100%;overflow:visible}
.bubble{position:relative;flex:1;background:var(--wall);border:1.5px solid #b9dde6;border-radius:16px;padding:12px 16px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;width:14px;height:14px;background:var(--wall);border-left:1.5px solid #b9dde6;border-bottom:1.5px solid #b9dde6;transform:rotate(45deg)}
.bubble .who{font-family:var(--f-term);font-size:12px;letter-spacing:.08em;color:var(--cyan)}
.bubble p{margin:2px 0 0;font-family:var(--f-term);font-size:16px;line-height:1.7;color:var(--ink);min-height:1.7em;white-space:pre-line}
.gl{color:var(--cyan);opacity:.6}
.bot .ant{transform-origin:50px 20px;animation:sway 3s ease-in-out infinite}
.bot.glitch svg{animation:jit .5s steps(2) infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes jit{0%{transform:translateX(0)}50%{transform:translateX(1.5px)}}
.bot .talk{animation:talk .35s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
.bot .talk{transform-origin:50px 56px}

/* 시작 화면 */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding-block:24px 8px}
.hero .stamp{font-family:var(--f-term);font-size:13px;color:var(--amber);letter-spacing:.16em}
.hero h1{font-size:clamp(40px,8vw,72px);line-height:1.1}
.hero h1 span{color:var(--cyan)}
.prologue{max-width:60ch;margin:10px 0 0;color:#334454}
.hero .bot.bigbot{width:clamp(120px,24vw,200px);height:auto;aspect-ratio:1}
.setup{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:start}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{text-align:left;border:1.5px solid var(--line);background:var(--wall-2);border-radius:12px;padding:12px 14px}
.mode[aria-pressed="true"]{border-color:var(--lamp);background:var(--amber-soft);box-shadow:0 0 0 3px rgba(255,180,42,.25)}
.mode h3{font-size:22px}
.mode .muted{font-size:15px}
.names{display:flex;flex-wrap:wrap;gap:10px}
.names input{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--wall);color:var(--ink);width:min(220px,100%)}
.seg-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* 출입증 */
.badges{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.badge-wrap{position:relative;width:212px;padding-top:62px;transform-origin:50% 0;animation:swing 4s ease-in-out infinite}
.badge-wrap:nth-child(2){animation-delay:-1.3s}
@keyframes swing{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.strap{position:absolute;top:0;left:50%;width:30px;margin-left:-15px;height:44px;background:repeating-linear-gradient(90deg,#147f99 0 3px,#1a93b0 3px 6px);border-radius:0 0 4px 4px}
.badge-wrap.b2 .strap{background:repeating-linear-gradient(90deg,#c97a00 0 3px,#e38f0b 3px 6px)}
.clip{position:absolute;top:38px;left:50%;width:22px;margin-left:-11px;height:30px;border-radius:6px;background:linear-gradient(90deg,#9aa6b2,#e9eef2 45%,#8b97a3);box-shadow:inset 0 0 0 1.5px #77838f}
.clip::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:8px;border-radius:3px;background:#59636d}
.badge{position:relative;background:#fff;border-radius:14px;border:1px solid #d5dde5;box-shadow:0 2px 4px rgba(0,0,0,.08),0 12px 28px rgba(29,43,58,.16);overflow:hidden;padding-bottom:4px}
.badge .slot{position:absolute;top:9px;left:50%;width:44px;margin-left:-22px;height:8px;border-radius:5px;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);z-index:2}
.b-head{background:linear-gradient(135deg,#147f99,#1f9dbb);color:#fff;padding:26px 12px 10px;display:flex;gap:8px;align-items:center}
.b-head.alt{background:linear-gradient(135deg,#c97a00,#ee9c1a)}
.b-head svg{width:28px;height:28px;flex:0 0 auto}
.b-head b{font-weight:400;font-family:var(--f-display);font-size:18px;display:block;line-height:1.1}
.b-head small{font-family:var(--f-term);font-size:8.5px;letter-spacing:.12em;opacity:.9}
.b-body{display:flex;gap:10px;padding:12px 12px 6px}
.photo{width:70px;height:86px;flex:0 0 auto;border-radius:6px;background:linear-gradient(180deg,#e6edf3,#d4dee7);border:1px solid #c9d4de;overflow:hidden;display:grid;place-items:end center}
.photo svg{width:100%;height:auto}
.b-info{min-width:0;display:grid;align-content:start;gap:1px}
.b-info small,.b-row small{font-family:var(--f-term);font-size:8.5px;letter-spacing:.1em;color:#7a8a99;display:block}
.b-name{font-family:var(--f-display);font-size:24px;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere;margin-bottom:4px}
.b-name.empty{color:#a4b1bd;font-size:16px}
.b-info span{font-size:12.5px}
.b-row{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;padding:4px 12px 6px;font-size:11.5px}
.b-row span{font-family:var(--f-term)}
.holo{height:14px;margin:4px 12px;border-radius:3px;background:linear-gradient(110deg,#d9f1ff,#f7d9ff 25%,#fff3c8 45%,#d6ffe9 65%,#d9e4ff 85%);background-size:200% 100%;animation:holo 5s linear infinite;opacity:.9}
@keyframes holo{to{background-position:200% 0}}
.barcode{display:flex;align-items:stretch;height:26px;margin:4px 12px 0;gap:1px}
.barcode i{background:var(--ink);display:block}
.barcode-num{font-family:var(--f-term);font-size:9px;letter-spacing:.3em;text-align:center;color:#6b7a88;padding-bottom:8px}
.stamp-ok{position:absolute;right:12px;bottom:44px;border:3px solid #c93a30;color:#c93a30;font-family:var(--f-display);font-size:20px;padding:2px 8px;border-radius:6px;transform:rotate(-14deg);background:rgba(255,255,255,.7);animation:stampin .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampin{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}

/* 평면도 */
.plan{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"r1 r2" "hall hall" "r3 r4" "r5 exit";border:4px solid #9fb0c0;border-radius:8px;background:var(--wall);overflow:hidden;box-shadow:var(--shadow)}
.cell{position:relative;text-align:left;background:var(--dark-room);border:0;border-right:3px solid #9fb0c0;border-bottom:3px solid #9fb0c0;padding:16px;min-height:132px;display:grid;gap:4px;align-content:start;border-radius:0;transition:background .3s}
.cell.r2,.cell.r4,.cell.exit{border-right:0}
.cell .no{font-family:var(--f-term);font-size:12px;color:var(--muted);letter-spacing:.1em}
.cell h3{font-size:clamp(20px,4vw,26px)}
.cell .st{font-size:14px;color:var(--muted)}
.cell .lamp{position:absolute;top:14px;right:14px;width:14px;height:14px;border-radius:50%;background:#aab7c4;box-shadow:inset 0 0 0 2px #93a2b1}
.cell.lit{cursor:default;background:radial-gradient(130% 100% at 85% 0%,#fff1c9,#fffaf0 70%)}
.cell.lit .lamp{background:var(--lamp);box-shadow:0 0 14px var(--lamp)}
.cell.lit .st{color:var(--amber)}
.cell.open:hover{background:#d3dce5}
.cell.closed{cursor:not-allowed;opacity:.6}
.cell.r1{grid-area:r1}.cell.r2{grid-area:r2}.cell.r3{grid-area:r3}.cell.r4{grid-area:r4}.cell.r5{grid-area:r5;border-bottom:0}
.cell.bonus .no::after{content:" · BONUS";color:var(--cyan)}
.hall{grid-area:hall;border-bottom:3px solid #9fb0c0;padding:8px 16px;font-family:var(--f-term);font-size:12px;color:var(--muted);letter-spacing:.3em;text-align:center;background:repeating-linear-gradient(90deg,#f5f8fb 0 22px,#e9eff4 22px 34px)}
.cell.exit{grid-area:exit;border-bottom:0;background:repeating-linear-gradient(135deg,#e3e9ef 0 14px,#d9e1e9 14px 28px)}
.cell.exit.ready{background:repeating-linear-gradient(135deg,#ffe7a8 0 14px,#fff5d9 14px 28px)}
.cell.exit.ready .lamp{background:var(--lamp);box-shadow:0 0 14px var(--lamp)}

/* 방 머리 */
.room-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between}
.room-head h2{font-size:clamp(30px,6vw,40px)}
.mission{margin:4px 0 0;color:#334454;max-width:64ch}
.rule{font-size:14px;background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:6px 12px}
.counter{font-family:var(--f-term);font-size:13px;color:var(--muted);margin-block:10px}
.hintbox{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hinttext{flex:1 1 280px;font-size:15px;color:var(--cyan)}

/* 1번 방 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.tile{aspect-ratio:3/4;max-width:100%;border:0;padding:0;perspective:700px;background:transparent}
.tile .in{position:relative;display:block;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.tile.open .in,.tile.fixed .in,.tile.trap .in{transform:rotateY(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:grid;place-items:center;align-content:center;gap:6px}
.tile .b{background:linear-gradient(160deg,#dbe8f0,#c9d9e5);border:1.5px solid #b3c6d5;box-shadow:var(--shadow)}
.tile .b svg{width:62%;height:auto}
.tile .b span{font-family:var(--f-term);font-size:11px;color:var(--muted);letter-spacing:.1em}
.tile .f{transform:rotateY(180deg);background:var(--tag);color:var(--tag-ink);border:1.5px solid var(--tag-line);box-shadow:var(--shadow)}
.tile .f::before{content:"";position:absolute;top:9px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.tile .f .w{font-family:var(--f-display);font-size:clamp(26px,5vw,36px)}
.tile .f .d{font-size:12px;font-family:var(--f-term)}
.tile.fixed .f{box-shadow:0 0 0 3px var(--lamp),0 0 16px rgba(255,180,42,.45)}
.tile.trap .f{opacity:.6;background:#ece6d8}

/* 2번 방 */
.circuit{display:flex;align-items:center;overflow-x:auto;padding-block:4px 14px}
.node{flex:0 0 auto;min-width:92px;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--wall)}
.node small{display:block;font-family:var(--f-term);font-size:11px;color:var(--muted)}
.node b{font-weight:400;font-family:var(--f-display);font-size:20px;white-space:nowrap}
.node.now{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.node.on{border-color:var(--lamp);background:var(--amber-soft)}
.wire{flex:1 0 22px;height:4px;background:var(--line);border-radius:2px}
.wire.on{background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.q{display:grid;gap:12px}
.q h3{font-size:23px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--wall);border-radius:10px;padding:12px;font-size:19px;text-align:center;box-shadow:0 1px 0 var(--line)}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt[aria-pressed="true"]{border-color:var(--lamp);background:var(--amber-soft)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt small{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.gauge{display:grid;justify-items:center;gap:8px}
.gauge svg{width:min(260px,100%);height:auto}

/* 3번 방 */
.locks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.lock{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--wall);display:grid;gap:8px;box-shadow:var(--shadow)}
.lock.open{border-color:var(--lamp);background:linear-gradient(180deg,var(--amber-soft),var(--wall))}
.lock .top{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-term);font-size:12px;color:var(--muted)}
.lock.open .top{color:var(--amber)}
.sent{text-align:left;border:1.5px solid var(--line);background:var(--wall-2);border-radius:10px;padding:10px 12px;font-size:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.sent mark{background:transparent;color:var(--amber);font-weight:700;border-bottom:2px solid var(--lamp)}
.sent[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.sent.done{border-style:dashed;cursor:default}
.sent .pos{flex:0 0 auto;font-family:var(--f-display);font-size:15px;background:var(--tag);border:1px solid var(--tag-line);color:var(--tag-ink);border-radius:6px;padding:1px 8px}
.drawer{position:sticky;bottom:0;margin-top:14px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;box-shadow:0 -6px 18px rgba(29,43,58,.08)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.bin{border:1.5px solid #b9c8d6;background:linear-gradient(180deg,#fff,#eef3f7);border-radius:8px;padding:9px 4px;font-family:var(--f-display);font-size:19px}
.bin:disabled{opacity:.4;cursor:not-allowed}
.drawer .note{font-size:15px;min-height:1.5em}

/* 4번 방 */
.bench{display:grid;gap:16px;justify-items:center;text-align:center}
.word{display:flex;align-items:stretch;justify-content:center;flex-wrap:wrap}
.syl{font-family:var(--f-display);font-size:clamp(40px,10vw,68px);background:var(--tag);color:var(--tag-ink);border-block:1.5px solid var(--tag-line);padding:4px 12px;line-height:1.25}
.syl:first-child{border-radius:10px 0 0 10px;border-left:1.5px solid var(--tag-line)}.syl:last-child{border-radius:0 10px 10px 0;border-right:1.5px solid var(--tag-line)}
.gap{border:0;background:transparent;width:34px;display:grid;place-items:center;color:var(--muted);font-size:22px;position:relative}
.gap::before{content:"";position:absolute;top:8%;bottom:8%;left:50%;border-left:2px dashed #b3c3d2}
.gap span{position:relative;background:var(--wall);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;border:1.5px solid var(--line)}
.gap:hover span,.gap:focus-visible span{border-color:var(--cyan);color:var(--cyan)}
.gap:disabled{cursor:not-allowed;opacity:.4}
.parts{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.part{display:grid;gap:8px;justify-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--wall-2)}
.part .pw{font-family:var(--f-display);font-size:34px;background:var(--tag);border:1px solid var(--tag-line);color:var(--tag-ink);border-radius:8px;padding:0 14px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--wall)}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--lamp);color:#2a1a00}

/* 5번 방 */
.decoder{display:grid;gap:14px;justify-items:center;text-align:center}
.cipher{font-family:var(--f-display);font-size:clamp(44px,11vw,76px);color:var(--cyan);letter-spacing:.06em;background:var(--cyan-soft);border:1.5px dashed #9fcfdb;border-radius:14px;padding:4px 26px}
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.card{border:1.5px solid var(--tag-line);background:var(--tag);color:var(--tag-ink);border-radius:10px;padding:10px 16px;font-family:var(--f-display);font-size:22px;box-shadow:var(--shadow)}
.card[aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan-soft);box-shadow:0 0 0 3px #bfe3ec}
.equation{font-family:var(--f-display);font-size:26px;color:var(--ink)}
.equation em{font-style:normal;color:var(--amber)}

/* 출입문 */
.slots{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.sylbox{display:grid;grid-template-columns:repeat(2,64px);grid-template-rows:64px 64px;gap:6px;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--wall-2)}
.slot{border:1.5px dashed #b3c3d2;border-radius:8px;background:var(--wall);font-family:var(--f-display);font-size:32px;display:grid;place-items:center}
.slot.full{border:1.5px solid var(--tag-line);background:var(--tag);color:var(--tag-ink)}
.slot.fixed{border-style:dotted;color:var(--muted);cursor:default;font-size:26px}
.slot.jong{grid-column:1 / span 2}
.slot small{font-size:11px;font-family:var(--f-term);color:var(--muted)}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:60px}
.tray .pc{width:56px;height:56px;border-radius:8px;border:1.5px solid var(--tag-line);background:var(--tag);color:var(--tag-ink);font-family:var(--f-display);font-size:30px;box-shadow:var(--shadow)}
.tray .pc[aria-pressed="true"]{box-shadow:0 0 0 3px var(--lamp)}
.preview{font-family:var(--f-display);font-size:56px;min-height:1.3em;color:var(--amber)}
.doors{position:relative;height:200px;max-width:420px;width:100%;margin:0 auto;border:4px solid #9fb0c0;border-radius:6px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#ffffff,#fff1c4 40%,#ffc24d)}
.doors .d{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(0deg,#d9e2ea 0 18px,#cbd6e0 18px 20px);transition:transform 1.6s cubic-bezier(.7,0,.2,1)}
.doors .l{left:0;border-right:2px solid #9fb0c0}.doors .r{right:0}
.doors.opened .l{transform:translateX(-100%)}.doors.opened .r{transform:translateX(100%)}

/* 피드백·모달 */
.fb{border-radius:10px;padding:10px 14px;font-size:16px;text-align:left}
.fb.bad{background:var(--bad-soft);border:1px solid #efb3ae}
.fb.ok{background:var(--ok-soft);border:1px solid #9fd5b9}
.fb.trap{background:var(--amber-soft);border:1px solid #f1cf8a}
.lockmsg{font-family:var(--f-term);font-size:13px;color:var(--muted)}
.reveal{outline:2.5px dashed var(--amber)!important;outline-offset:3px}
.ans{font-family:var(--f-term);font-size:12px;color:var(--amber)}
.veil{position:fixed;inset:0;background:rgba(29,43,58,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--wall);border-radius:16px;padding:22px;max-width:560px;width:100%;display:grid;gap:14px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(29,43,58,.3)}
.modal h2{font-size:30px}
.pairshow{display:flex;gap:12px;justify-content:center;align-items:center;font-family:var(--f-display);font-size:40px}
.pairshow i{font-style:normal;font-size:20px;color:var(--muted)}
.bigpiece{width:84px;height:84px;border-radius:10px;background:var(--tag);border:1.5px solid var(--tag-line);color:var(--tag-ink);font-family:var(--f-display);font-size:52px;display:grid;place-items:center;margin:0 auto;box-shadow:0 0 0 6px var(--amber-soft),0 0 28px rgba(255,180,42,.5)}
.mbot{display:flex;gap:12px;align-items:center}
.mbot .bot{width:60px;height:60px}
.settings{display:grid;gap:10px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--wall-2);text-align:left}
.toggle b{font-weight:400;font-family:var(--f-display);font-size:18px}
.toggle .sw{flex:0 0 auto;font-family:var(--f-term);font-size:13px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted);background:var(--wall)}
.toggle[aria-pressed="true"] .sw{background:var(--lamp);color:#2a1a00;border-color:var(--lamp)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--wall);border-radius:8px;padding:6px 12px;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--lamp);border-color:var(--lamp);color:#2a1a00}
.note-body{font-size:16px;line-height:1.7}
.note-body table{border-collapse:collapse;width:100%;font-size:15px}
.note-body th,.note-body td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.note-body th{color:var(--muted);font-weight:400;font-size:13px}
.note-body p{margin:.4em 0}
.note-body b{color:var(--amber);font-weight:400;font-family:var(--f-display);font-size:17px}

/* 결과 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-block:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--wall);box-shadow:var(--shadow)}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-weight:400;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.log{width:100%;border-collapse:collapse;font-size:15px}
.log th,.log td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.log th{font-weight:400;color:var(--muted);font-size:13px}
.tblwrap{overflow-x:auto}
.cert{background:var(--tag);border:1.5px solid var(--tag-line);color:var(--tag-ink);border-radius:14px;padding:22px 24px;display:grid;gap:6px;position:relative;margin-block:14px;box-shadow:var(--shadow)}
.cert small{font-family:var(--f-term);font-size:12px;letter-spacing:.14em}
.cert h3{font-size:28px;padding-right:90px}
.cert .seal{position:absolute;right:20px;top:18px;width:74px;height:74px;border-radius:50%;border:3px solid #b5401f;color:#b5401f;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;transform:rotate(-12deg);text-align:center;line-height:1.1}
.rate{display:grid;grid-template-columns:7em 1fr 3.5em;gap:10px;align-items:center;font-size:15px}
.rate .track{height:10px;background:var(--dark-room);border-radius:5px;overflow:hidden}
.rate .fill{display:block;height:100%;background:var(--lamp);border-radius:5px}
.rate span:last-child{font-family:var(--f-term);font-variant-numeric:tabular-nums;text-align:right}
.debrief{margin:0;padding-left:1.3em;display:grid;gap:8px}
html.big body{zoom:1.15}
.credit{max-width:1000px;margin:-90px auto 0;padding-inline:16px;padding-block:18px 32px;text-align:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:1080px){.bar .ttl{display:none}}
@media (max-width:720px){.setup{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero .bigbot{justify-self:center}}
@media (max-width:520px){.cell{min-height:118px;padding:12px}.sylbox{grid-template-columns:repeat(2,54px);grid-template-rows:54px 54px}.bot{width:62px;height:62px}.badge-wrap{width:212px}}
@media (prefers-reduced-motion:reduce){.tile .in,.doors .d{transition:none}.bot .ant,.bot.glitch svg,.bot .talk,.badge-wrap,.holo{animation:none}}
</style>

<script>
/* ===================== 선생님이 바꿀 수 있는 설정 ===================== */
const CONFIG = {
  wrongLockSec: 4,       // 오답 뒤 버튼이 잠기는 시간(초)
  hintAfterSec: {basic:90, hard:150}, // 방에 들어온 뒤 힌트가 열리는 시간(초)

  room5Pick: 4,          // 5번 방 새말 수

/* 최종 비밀번호: 같이 → [가치]. 네 방에서 얻는 조각은 게임마다 무작위로 배정된다 */
const PASS = {word:'같이', pieces:['ㄱ','ㅏ','ㅌ','ㅣ'], pron:['[가치]','[가티]','[갇치]','[가지]'], chg:['구개음화','거센소리되기','비음화']};

/* 1번 방: 최소대립쌍. opts[0]이 정답 */
const ROOM1 = {
  pairs: [
    {a:'불', b:'풀', opts:['ㅂ ↔ ㅍ','ㅜ ↔ ㅡ','ㄹ ↔ ㄴ','ㅂ ↔ ㅃ']},

/* 4번 방: 직접 구성 성분 분석. cut = 몇 번째 음절 뒤를 자르는지(1부터)

/* ===================== 한글 자모 도우미 ===================== */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄱㅅ','ㄴ','ㄴㅈ','ㄴㅎ','ㄷ','ㄹ','ㄹㄱ','ㄹㅁ','ㄹㅂ','ㄹㅅ','ㄹㅌ','ㄹㅍ','ㄹㅎ','ㅁ','ㅂ','ㅂㅅ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function phonemes(word){
  const out=[];
  for(const ch of word){
    const c=ch.charCodeAt(0)-0xAC00; if(c<0||c>11171) continue;
    const cho=CHO[Math.floor(c/588)], jung=JUNG[Math.floor((c%588)/28)], jong=JONG[c%28];
    if(cho!=='ㅇ') out.push(cho);
    out.push(jung); for(const j of jong) out.push(j);
  }
  return out;
}
function compose(cho,jung,jong){
  const a=CHO.indexOf(cho), b=JUNG.indexOf(jung), c=jong?JONG.indexOf(jong):0;
  if(a<0||b<0||c<0) return (cho||'')+(jung||'')+(jong||'');
  return String.fromCharCode(0xAC00+(a*21+b)*28+c);
}

/* 효과음: 브라우저에서 바로 합성 */
let AC=null;
function sfx(kind){
  if(!PREF.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,.08],[880,.14]],bad:[[150,.22]],flip:[[540,.05]],clear:[[523,.11],[659,.11],[784,.11],[1047,.28]],door:[[196,.35],[262,.35],[392,.6]],key:[[988,.08],[1319,.2]]}[kind];
    let t=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='bad'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='bad'?.08:.14,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.85});
  }catch(e){}
}

  const k=o.room+'|'+o.key; S.miss[k]=(S.miss[k]||0)+1; sfx('bad'); setMood('worried',1600);
  S.wrongs.push({room:o.room,item:o.key,chose:o.chose,right:o.right});

  if(S.diff==='basic' && S.miss[k]===CONFIG.revealAfterMiss){
    S.helps++; if(o.reveal) o.reveal(); msg+=`<br><b style="color:var(--amber)">도움:</b> 정답은 <b>${esc(o.right)}</b>예요. 왜 그런지 짝과 확인하고 고르세요.`;
  }
  if(o.fb) o.fb.innerHTML=`<div class="fb bad">${msg}</div>`;
  if(o.btns) lockButtons(o.btns,o.lock);

function say(text){
  const el=document.getElementById('onumLine'); if(!el) return;
  const lv=[.16,.1,.05,.02,0][Math.min(restored(),4)];
  const clean=[...text].map(esc), chars=[...text].map((ch,i)=>(/\S/.test(ch)&&Math.random()<lv)?'<span class="gl">▒</span>':clean[i]);
  clearInterval(typeTimer);
  const fix=()=>{let k=0; const id=setInterval(()=>{let n=0; for(let i=0;i<chars.length&&n<3;i++){if(chars[i]!==clean[i]){chars[i]=clean[i];n++}} el.innerHTML=chars.join(''); if(!n||++k>80) clearInterval(id)},90)};
  if(reduce){el.innerHTML=clean.join('');return}
  let i=0; el.innerHTML='';
  typeTimer=setInterval(()=>{i+=2; el.innerHTML=chars.slice(0,i).join(''); if(i>=chars.length){clearInterval(typeTimer);setTimeout(fix,400)}},28);
  document.getElementById('onum').onclick=()=>{clearInterval(typeTimer);el.innerHTML=clean.join('')};
}

function badgeHTML(name,i,approved){
  const h=hash((name||'')+i), id=String(h%9000+1000), seed=h;
  let bars='', x=seed; for(let k=0;k<34;k++){x=Math.imul(x^(x>>>13),1274126177)>>>0; const w=1+(x%3); bars+=`<i style="width:${w}px;${k%5===4?'margin-right:2px':''}"></i>`}
  return `<div class="badge-wrap ${i?'b2':''}"><div class="strap"></div><div class="clip"></div>
    <div class="badge"><div class="slot"></div>
      <div class="b-head ${i?'alt':''}">${LOGO}<div><b>언어 연구소</b><small>LANGUAGE RESEARCH LAB</small></div></div>
      <div class="b-body"><div class="photo">${AVATAR[i%2]}</div>

        <small>소속 DEPT</small><span>음운·단어 연구팀</span><small>직책 ROLE</small><span>연구원 · 회로 복구</span></div></div>
      <div class="b-row"><div><small>번호 ID</small><span>LL-26-${id}</span></div><div><small>출입 ACCESS</small><span>B1 연구동</span></div>
        <div><small>발급 ISSUED</small><span>${today()}</span></div><div><small>유효 VALID</small><span>오늘 밤까지</span></div></div>
      <div class="holo" aria-hidden="true"></div>
      <div class="barcode" aria-hidden="true">${bars}</div><div class="barcode-num">${id}${String(h%97).padStart(2,'0')}</div>
      ${approved?'<div class="stamp-ok">출입 승인</div>':''}
    </div></div>`;
}

  where='map'; clearInterval(hintTimer); renderBar(false);
  const allDone=PREF.teacher||mainDone();
  const cell=r=>{
    const lit=!!S.done[r.id], open=r.ready&&(!lit||PREF.teacher);
    const st=lit?(r.bonus?'보너스 회로 복구 완료':'회로 복구 완료'):r.bonus?`보너스 · 성공하면 기록 −${CONFIG.bonusSec}초`:'불 꺼짐 · 입장 가능';

function roomClear(id,extra=''){
  clearInterval(hintTimer);
  const first=!S.done[id], bonus=ROOMS[id-1].bonus;
  if(first){S.done[id]=true; if(bonus){S.bonus=true; S.penalty-=CONFIG.bonusSec} else S.got.push(S.pieceOf[id])}
  where='map-pending'; renderBar(false); save(); sfx('clear');
  const reward=!first?'':bonus?`<div class="fb ok" style="text-align:center;font-size:18px">보너스 성공! 탈출 기록에서 <b>${CONFIG.bonusSec}초</b>를 빼 드렸어요.</div>`:`<div class="bigpiece">${S.pieceOf[id]}</div>`;
  openModal(`<span class="eyebrow">${bonus?'보너스 회로 복구':`회로 ${restored()}/4 복구`}</span><h2>${ROOMS[id-1].title} 불이 켜졌어요</h2>
    <div class="mbot">${botHTML(false,'happy')}<p class="term" style="margin:0;color:var(--cyan)">온음: ${esc(LINES.clear[id])}${first&&!bonus?' 그리고… 기억 조각 하나가 떠올랐어요.':''}</p></div>
    ${reward}${extra}
    <button class="btn" id="back">평면도로 돌아가기</button>`);
  document.getElementById('back').onclick=()=>{closeModal();renderMap()};
}

/* ===================== 1번 방: 소리 보관실 ===================== */
const WAVE_SVG='<svg viewBox="0 0 60 24" aria-hidden="true"><path d="M0 12 Q5 2 10 12 T20 12 T30 12 T40 12 T50 12 T60 12" fill="none" stroke="#147f99" stroke-width="2.2"/></svg>';
function renderRoom1(){
  renderBar(true);
  const R='1번 방';
  const words=[]; ROOM1.pairs.forEach((p,i)=>words.push({w:p.a,k:'p'+i},{w:p.b,k:'p'+i}));
  words.push({w:ROOM1.trap.a,k:'trap'},{w:ROOM1.trap.b,k:'trap'});
  const tiles=shuffle(words).map((t,i)=>({...t,id:i,state:'down'}));
  let open=[], busy=false, fixed=0;
  $app.innerHTML=`${roomHead(1,'표본 꼬리표 두 장을 뒤집어 최소대립쌍을 찾으세요. 짝을 찾으면 달라진 음운을 맞혀야 표본이 고정됩니다.')}
  <div class="counter" id="r1count">고정한 표본 0 / ${ROOM1.pairs.length}쌍</div>
  <div class="tiles" id="tiles"></div>${hintBlock()}`;
  say(LINES.room[1]);
  const $t=document.getElementById('tiles');
  const draw=()=>{
    $t.innerHTML=tiles.map(t=>`<button class="tile ${t.state}" data-i="${t.id}" aria-label="${t.state==='down'?'뒤집힌 표본':t.w}">
      <span class="in"><span class="b">${WAVE_SVG}<span>S-${String(t.id+1).padStart(2,'0')}</span>${PREF.teacher?`<span class="ans">${t.w}</span>`:''}</span>
      <span class="f"><span class="w">${t.w}</span>${t.label?`<span class="d">${esc(t.label)}</span>`:''}</span></span></button>`).join('');
    $t.querySelectorAll('.tile').forEach(b=>b.onclick=()=>flip(+b.dataset.i));
  };
  const flip=i=>{
    const t=tiles[i]; if(busy||t.state!=='down') return;
    t.state='open'; open.push(t); sfx('flip'); draw();
    if(open.length<2) return;
    busy=true; const [x,y]=open;
    if(x.k===y.k && x.k==='trap') setTimeout(()=>askTrap(x,y),450);
    else if(x.k===y.k) setTimeout(()=>askDiff(x,y),450);
    else setTimeout(()=>{x.state=y.state='down';open=[];busy=false;draw()},1100);
  };
  const optsHTML=(opts,left)=>`<div class="opts" ${left?'style="grid-template-columns:1fr"':''}>${opts.map(o=>`<button class="opt" ${left?'style="font-size:17px;text-align:left"':''} data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  const askTrap=(x,y)=>{
    const key='낫·낮 함정 판정', right=ROOM1.trap.opts[0];
    openModal(`<span class="eyebrow">수상한 표본</span><h2>이 둘은 최소대립쌍일까요?</h2>
      <div class="pairshow">${x.w}<i>·</i>${y.w}</div>
      <p class="muted" style="margin:0">제대로 판정하면 온음이 비상 열쇠를 줍니다. 비상 열쇠가 있으면 힌트를 벌점 없이 볼 수 있어요.</p>
      ${optsHTML(shuffle(ROOM1.trap.opts),true)}<div id="fb"></div><div class="lockmsg" id="lock"></div>`);
    const btns=[...document.querySelectorAll('#modal .opt')];
    markTeacher(btns,b=>b.dataset.o===right);
    btns.forEach(b=>b.onclick=()=>{
      if(b.dataset.o===right){
        hit(R,key); S.trapFound=true; S.keys++; sfx('key'); renderBar(true);
        document.getElementById('modal').innerHTML=`<span class="eyebrow">함정 판정 성공</span><h2>비상 열쇠를 얻었어요</h2>
          <div class="fb trap">낫과 낮은 표기는 다르지만 둘 다 <b>${ROOM1.trap.sound}</b>으로 소리 나요. 최소대립쌍은 <b>소리</b> 하나 차이로 뜻이 갈리는 쌍이라서, 표기만 다른 이 둘은 해당하지 않아요.</div>
          <p class="term" style="margin:0;color:var(--cyan)">온음: 이 열쇠는 어느 방에서든 힌트 한 번을 벌점 없이 열어 줘요.</p>
          <button class="btn" id="ok">열쇠 챙기기</button>`;
        const ok=document.getElementById('ok'); ok.focus();
        ok.onclick=()=>{closeModal();x.state=y.state='trap';x.label=y.label='소리 같음 [낟]';open=[];busy=false;draw()};
      } else miss({room:R,key,chose:b.dataset.o,right,tip:ROOM1.trap.tip,btns,fb:document.getElementById('fb'),lock:document.getElementById('lock'),
        reveal:()=>btns.forEach(z=>z.dataset.o===right&&z.classList.add('reveal'))});
    });
  };
  const askDiff=(x,y)=>{
    const p=ROOM1.pairs[+x.k.slice(1)], right=p.opts[0], key=`${p.a}–${p.b} 달라진 음운`;
    openModal(`<span class="eyebrow">짝을 찾았어요</span><h2>달라진 음운은 무엇인가요?</h2>
      <div class="pairshow">${x.w}<i>·</i>${y.w}</div>
      <p class="rule" style="margin:0">${ruleText()}</p>
      ${optsHTML(shuffle(p.opts))}<div id="fb"></div><div class="lockmsg" id="lock"></div>`);
    const btns=[...document.querySelectorAll('#modal .opt')];
    markTeacher(btns,b=>b.dataset.o===right);
    btns.forEach(b=>b.onclick=()=>{
      if(b.dataset.o===right){
        hit(R,key); closeModal(); x.state=y.state='fixed'; x.label=y.label=right; open=[]; busy=false; fixed++;
        document.getElementById('r1count').textContent=`고정한 표본 ${fixed} / ${ROOM1.pairs.length}쌍`; draw();
        if(fixed===ROOM1.pairs.length) setTimeout(()=>{
          let extra='';
          if(!S.trapFound){
            tiles.filter(t=>t.k==='trap').forEach(t=>{t.state='trap';t.label='소리 같음 [낟]'}); draw();
            extra=`<div class="fb trap"><b>놓친 함정:</b> 남은 표본 낫과 낮은 둘 다 [낟]으로 소리 나서 최소대립쌍이 아니에요. 표기가 아니라 소리가 기준이에요.</div>`;
          }
          roomClear(1,extra);
        },500);
      } else miss({room:R,key,chose:b.dataset.o,right,btns,fb:document.getElementById('fb'),lock:document.getElementById('lock'),
        tip:`음운으로 풀어 쓰면 ${p.a} = ${phonemes(p.a).join(' ')} / ${p.b} = ${phonemes(p.b).join(' ')}`,
        reveal:()=>btns.forEach(z=>z.dataset.o===right&&z.classList.add('reveal'))});
    });
  };
  draw(); armHint(ROOM1.hint);
}

/* ===================== 2번 방: 발음 복구실 ===================== */
function renderRoom2(){
  renderBar(true);
  const R='2번 방';
  const queue=[...shuffle(ROOM2.items).slice(0,CONFIG.room2Pick).map(it=>({...it})),{...ROOM2.boss,boss:true}];
  let qi=0, step=0, picked={};
  $app.innerHTML=`${roomHead(2,'끊어진 전선을 표기 → 발음 → 변동 → 유형 → 음운 개수 순서로 이어 장치에 불을 켜세요. 마지막에는 여러 변동이 겹친 보스 장치가 나옵니다.')}
  <div class="counter" id="r2count"></div><div class="circuit" id="circuit"></div><div class="panel q" id="q"></div>${hintBlock()}`;
  say(LINES.room[2]);
  const steps=it=>it.boss?['pron','chgMulti','count']:['pron','chg','type','count'];
  const nodeLabels={pron:'발음',chg:'변동',chgMulti:'변동 3개',type:'유형',count:'음운 개수'};
  const drawCircuit=()=>{
    const it=queue[qi], st=steps(it);
    const vals={pron:picked.pron,chg:picked.chg,chgMulti:'연결됨',type:picked.type,count:picked.count!=null?(picked.count>0?'+':'')+picked.count:''};
    let h=`<div class="node on"><small>표기</small><b>${it.w}</b></div>`;
    st.forEach((s,i)=>{h+=`<span class="wire ${i<step?'on':''}"></span><div class="node ${i<step?'on':i===step?'now':''}"><small>${nodeLabels[s]}</small><b>${i<step?esc(vals[s]):'?'}</b></div>`});
    document.getElementById('circuit').innerHTML=h;
    document.getElementById('r2count').textContent=it.boss?'보스 장치':`장치 ${qi+1} / ${queue.length-1}`;
  };
  const advance=()=>{
    step++;
    if(step>=steps(queue[qi]).length){
      drawCircuit(); const it=queue[qi];
      document.getElementById('q').innerHTML=`<div class="fb ok"><b>${it.w} → ${it.pron[0]}</b> 장치에 불이 들어왔어요.</div><div><button class="btn" id="nx">${qi+1<queue.length?'다음 장치':'발음 회로 켜기'}</button></div>`;
      const nx=document.getElementById('nx'); nx.focus();
      nx.onclick=()=>{qi++;step=0;picked={}; if(qi>=queue.length) roomClear(2); else draw()};
      return;
    }
    draw();
  };
  const fbs=()=>({fb:document.getElementById('fb'),lock:document.getElementById('lock')});
  const simple=(title,opts,right,key,tip,set)=>{
    const $q=document.getElementById('q');
    $q.innerHTML=`<h3>${title}</h3><div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${o}</button>`).join('')}</div><div id="fb"></div><div class="lockmsg" id="lock"></div>`;
    const btns=[...$q.querySelectorAll('.opt')];
    markTeacher(btns,b=>b.dataset.o===right);
    btns.forEach(b=>b.onclick=()=>{if(b.dataset.o===right){hit(R,key);set(right);advance()}
      else miss({room:R,key,chose:b.dataset.o,right,tip,btns,...fbs(),reveal:()=>btns.forEach(z=>z.dataset.o===right&&z.classList.add('reveal'))})});
  };
  const draw=()=>{
    drawCircuit();
    const it=queue[qi], s=steps(it)[step], $q=document.getElementById('q');
    if(s==='pron') simple(`'${it.w}'은 어떻게 소리 날까요?`,shuffle(it.pron),it.pron[0],`${it.w} 발음`,it.tip,v=>picked.pron=v);
    if(s==='chg') simple(`${it.w} → ${it.pron[0]} : 어떤 음운 변동이 일어났나요?`,shuffle(it.chg),it.chg[0],`${it.w} 변동 이름`,it.tip,v=>picked.chg=v);
    if(s==='type') simple(`${picked.chg}은 네 가지 유형 가운데 무엇인가요?`,ROOM2.types,it.type,`${it.w} 변동 유형`,ROOM2.typeTip,v=>picked.type=v);
    if(s==='chgMulti'){
      const sel=new Set(), key=`${it.w} 변동 고르기`, right=it.chgRight.join(', ');
      $q.innerHTML=`<h3>${it.w} → ${it.pron[0]} : 일어난 음운 변동 <b>세 가지</b>를 모두 고르세요.</h3>
        <div class="opts">${shuffle(it.chgAll).map(o=>`<button class="opt" data-o="${o}" aria-pressed="false">${o}</button>`).join('')}</div>
        <div><button class="btn" id="chk" disabled>연결하기 (0/3)</button></div><div id="fb"></div><div class="lockmsg" id="lock"></div>`;
      const btns=[...$q.querySelectorAll('.opt')], chk=document.getElementById('chk');
      markTeacher(btns,b=>it.chgRight.includes(b.dataset.o));
      btns.forEach(b=>b.onclick=()=>{
        const o=b.dataset.o; if(sel.has(o)) sel.delete(o); else if(sel.size<3) sel.add(o);
        btns.forEach(x=>x.setAttribute('aria-pressed',sel.has(x.dataset.o))); chk.disabled=sel.size!==3; chk.textContent=`연결하기 (${sel.size}/3)`;
      });
      chk.onclick=()=>{
        if(sel.size!==3) return;
        if(it.chgRight.every(c=>sel.has(c))){hit(R,key);picked.chgMulti=true;advance()}
        else{const chose=[...sel].join(', '); sel.clear();btns.forEach(x=>x.setAttribute('aria-pressed','false'));chk.disabled=true;chk.textContent='연결하기 (0/3)';
          miss({room:R,key,chose,right,tip:it.tip,btns,...fbs(),reveal:()=>btns.forEach(z=>it.chgRight.includes(z.dataset.o)&&z.classList.add('reveal'))})}
      };
    }
    if(s==='count'){
      const key=`${it.w} 음운 개수`;
      $q.innerHTML=`<h3>음운 계량기: ${it.w} → ${it.pron[0]}, 음운 개수는 어떻게 달라졌나요?</h3>
        <div class="gauge">${gaugeSVG(null)}<div class="opts" style="width:min(420px,100%)">${[-1,0,1].map(v=>`<button class="opt" data-v="${v}">${v>0?'+1':v===0?'0 (그대로)':'−1'}</button>`).join('')}</div></div>
        <div id="fb"></div><div class="lockmsg" id="lock"></div>`;
      const btns=[...$q.querySelectorAll('.opt')];
      markTeacher(btns,b=>+b.dataset.v===it.n);
      btns.forEach(b=>b.onclick=()=>{
        const v=+b.dataset.v; $q.querySelector('.gauge svg').outerHTML=gaugeSVG(v);
        if(v===it.n){hit(R,key);picked.count=v;btns.forEach(x=>x.disabled=true);setTimeout(advance,500)}
        else miss({room:R,key,chose:String(v),right:(it.n>0?'+':'')+it.n,tip:ROOM2.countTip,btns,...fbs(),reveal:()=>btns.forEach(z=>+z.dataset.v===it.n&&z.classList.add('reveal'))});
      });
    }
  };
  draw(); armHint(ROOM2.hint);
}
function gaugeSVG(v){
  const ang=v==null?-90:v*55;
  return `<svg viewBox="0 0 240 140" role="img" aria-label="음운 계량기">
    <path d="M20 120 A100 100 0 0 1 220 120" fill="none" stroke="#cfdae4" stroke-width="14" stroke-linecap="round"/>
    <text x="36" y="62" fill="#5b6d7f" font-size="16">−1</text><text x="115" y="38" fill="#5b6d7f" font-size="16">0</text><text x="186" y="62" fill="#5b6d7f" font-size="16">+1</text>
    <g transform="rotate(${ang} 120 120)"><line x1="120" y1="120" x2="120" y2="40" stroke="#e08a00" stroke-width="5" stroke-linecap="round"/></g>
    <circle cx="120" cy="120" r="9" fill="#1d2b3a"/></svg>`;
}

/* ===================== 3번 방: 품사 보안실 ===================== */
function renderRoom3(){
  renderBar(true);
  const R='3번 방';
  const locks=shuffle(ROOM3.items).slice(0,CONFIG.room3Pick).map((it,li)=>({...it,li,ok:[false,false]}));
  let sel=null, opened=0;
  $app.innerHTML=`${roomHead(3,'잠금장치마다 똑같이 생긴 말이 두 문장에 들어 있어요. 문장을 고른 뒤 아래 서랍에서 강조된 말의 품사를 누르세요. 두 문장을 모두 맞혀야 잠금이 풀립니다.')}
  <div class="counter" id="r3count">풀린 잠금 0 / ${locks.length}</div>
  <div class="locks" id="locks"></div>${hintBlock()}
  <div class="drawer"><div class="note" id="note">문장을 먼저 고르세요.</div>
    <div class="bins">${POS.map(p=>`<button class="bin" data-p="${p}">${p}</button>`).join('')}</div><div class="lockmsg" id="lock"></div></div>`;
  say(LINES.room[3]);
  const $l=document.getElementById('locks'), note=document.getElementById('note');
  const bins=[...document.querySelectorAll('.bin')];
  const clearReveal=()=>bins.forEach(b=>b.classList.remove('reveal'));
  const draw=()=>{
    $l.innerHTML=locks.map(L=>{
      const isOpen=L.ok[0]&&L.ok[1];
      return `<div class="lock ${isOpen?'open':''}"><div class="top"><span>LOCK · ${esc(L.key)}</span><span>${isOpen?'열림':'잠김'}</span></div>
      ${L.s.map((s,si)=>`<button class="sent ${L.ok[si]?'done':''}" data-l="${L.li}" data-s="${si}" aria-pressed="${!!(sel&&sel.li===L.li&&sel.si===si)}">
        <span>${esc(s[0])}<mark>${esc(s[1])}</mark>${esc(s[2])}${PREF.teacher&&!L.ok[si]?` <span class="ans">${s[3]}</span>`:''}</span>${L.ok[si]?`<span class="pos">${s[3]}${s[3]==='명사'&&L.key==='만큼'?'(의존)':''}</span>`:''}</button>`).join('')}</div>`;
    }).join('');
    $l.querySelectorAll('.sent').forEach(b=>b.onclick=()=>{
      const L=locks.find(x=>x.li===+b.dataset.l), si=+b.dataset.s; if(L.ok[si]) return;
      sel={li:L.li,si}; clearReveal(); const s=L.s[si]; sfx('flip');
      note.innerHTML=`고른 문장: ${esc(s[0])}<mark style="background:transparent;color:var(--amber)">${esc(s[1])}</mark>${esc(s[2])}`; draw();
    });
  };
  bins.forEach(b=>b.onclick=()=>{
    if(!sel){note.textContent='문장을 먼저 고르세요.';return}
    const L=locks.find(x=>x.li===sel.li), s=L.s[sel.si], key=`${s[0]}${s[1]}${s[2]}`, right=s[3]+(L.key==='만큼'&&s[3]==='명사'?'(의존 명사)':'');
    if(b.dataset.p===s[3]){
      hit(R,key); clearReveal(); L.ok[sel.si]=true; sel=null; note.textContent='정답! 다음 문장을 고르세요.';
      if(L.ok[0]&&L.ok[1]){opened++;document.getElementById('r3count').textContent=`풀린 잠금 ${opened} / ${locks.length}`}
      draw();
      if(opened===locks.length) setTimeout(()=>roomClear(3),500);
    } else {
      const wrap=document.createElement('div');
      miss({room:R,key,chose:b.dataset.p,right,tip:L.tip,btns:bins,fb:wrap,lock:document.getElementById('lock'),
        reveal:()=>bins.forEach(z=>z.dataset.p===s[3]&&z.classList.add('reveal'))});
      note.innerHTML=wrap.innerHTML;
    }
  });
  draw(); armHint(ROOM3.hint);
}

/* ===================== 4번 방: 단어 조립실 ===================== */
function renderRoom4(){
  renderBar(true);
  const R='4번 방';
  const half=Math.ceil(CONFIG.room4Compound/2);
  const syn=shuffle(ROOM4.compound.filter(x=>x.syn==='통사적')).slice(0,half);
  const non=shuffle(ROOM4.compound.filter(x=>x.syn==='비통사적')).slice(0,CONFIG.room4Compound-half);
  const items=shuffle([...shuffle(ROOM4.derived).slice(0,CONFIG.room4Derived),...syn,...non]).map(x=>({...x}));
  let qi=0;
  $app.innerHTML=`${roomHead(4,'부서진 단어에 가위질을 딱 한 번 하세요. 처음 둘로 나누는 자리가 곧 단어의 구조입니다. 부품이 어근인지 접사인지, 단어가 합성어인지 파생어인지 판정하고, 합성어라면 통사적인지 비통사적인지까지 가려내야 조립됩니다.')}
  <div class="counter" id="r4count"></div><div class="panel bench" id="bench"></div>${hintBlock()}`;
  say(LINES.room[4]);
  const $b=document.getElementById('bench');
  const fbs=()=>({fb:document.getElementById('fb'),lock:document.getElementById('lock')});
  const next=()=>{qi++; if(qi>=items.length) roomClear(4); else cutStage()};
  const cutStage=()=>{
    const it=items[qi], key=`${it.w} 자르는 자리`, right=it.syl.slice(0,it.cut).join('')+' | '+it.syl.slice(it.cut).join('');
    document.getElementById('r4count').textContent=`부품 ${qi+1} / ${items.length}`;
    let h='<div class="word">';
    it.syl.forEach((s,i)=>{h+=`<span class="syl">${s}</span>`; if(i<it.syl.length-1) h+=`<button class="gap" data-g="${i+1}" aria-label="${i+1}번째 음절 뒤 자르기"><span>✂</span></button>`});
    h+='</div>';
    $b.innerHTML=`<h3>어디를 자를까요?</h3>${h}<div id="fb" style="width:100%"></div><div class="lockmsg" id="lock"></div>`;
    const gaps=[...$b.querySelectorAll('.gap')];
    markTeacher(gaps,g=>+g.dataset.g===it.cut);
    gaps.forEach(g=>g.onclick=()=>{
      if(+g.dataset.g===it.cut){hit(R,key);partStage()}
      else miss({room:R,key,chose:it.syl.slice(0,+g.dataset.g).join('')+' | '+it.syl.slice(+g.dataset.g).join(''),right,tip:it.cutTip,btns:gaps,...fbs(),
        reveal:()=>gaps.forEach(z=>+z.dataset.g===it.cut&&z.classList.add('reveal'))});
    });
  };
  const partStage=()=>{
    const it=items[qi], role=[null,null], key=`${it.w} 판정`; let cls=null;
    const right=`${it.parts.map(p=>p[0]+' = '+p[1]).join(', ')} / ${it.cls}`;
    $b.innerHTML=`<h3>${it.w}: 부품을 판정하세요</h3>
      <div class="parts">${it.parts.map((p,i)=>`<div class="part"><span class="pw">${p[0]}</span>
        <div class="seg" data-i="${i}"><button data-v="어근" aria-pressed="false">어근</button><button data-v="접사" aria-pressed="false">접사</button></div></div>`).join('<span style="align-self:center;font-size:28px;color:var(--amber)">+</span>')}</div>
      <div class="seg" id="cls"><button data-v="합성어" aria-pressed="false">합성어</button><button data-v="파생어" aria-pressed="false">파생어</button></div>
      <button class="btn" id="build" disabled>조립하기</button><div id="fb" style="width:100%"></div><div class="lockmsg" id="lock"></div>`;
    const build=document.getElementById('build');
    const ready=()=>{build.disabled=!(role[0]&&role[1]&&cls)};
    const markRight=()=>{
      $b.querySelectorAll('.part .seg').forEach(sg=>sg.querySelectorAll('button').forEach(bt=>{if(bt.dataset.v===it.parts[+sg.dataset.i][1]) bt.classList.add('reveal')}));
      document.querySelectorAll('#cls button').forEach(bt=>{if(bt.dataset.v===it.cls) bt.classList.add('reveal')});
    };
    if(PREF.teacher) markRight();
    $b.querySelectorAll('.part .seg').forEach(sg=>sg.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{
      role[+sg.dataset.i]=bt.dataset.v; sg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===bt)); ready();
    }));
    document.querySelectorAll('#cls button').forEach(bt=>bt.onclick=()=>{cls=bt.dataset.v;document.querySelectorAll('#cls button').forEach(x=>x.setAttribute('aria-pressed',x===bt));ready()});
    build.onclick=()=>{
      const okRole=it.parts.every((p,i)=>p[1]===role[i]), okCls=cls===it.cls;
      if(okRole&&okCls){hit(R,key); it.syn?synStage():doneStage()}
      else{
        const all=[...$b.querySelectorAll('.seg button')];
        miss({room:R,key,chose:`${it.parts.map((p,i)=>p[0]+' = '+role[i]).join(', ')} / ${cls}`,right,
          tip:`${okRole?'부품 판정은 맞았어요. 단어 종류를 다시 보세요.':'부품 판정이 틀렸어요.'} ${it.tip}`,btns:all,...fbs(),reveal:markRight});
        const sec=lockSec(); if(sec){build.disabled=true; setTimeout(ready,sec*1000+50)}
      }
    };
  };
  const synStage=()=>{
    const it=items[qi], key=`${it.w} 통사적/비통사적`, right=it.syn+' 합성어', opts=['통사적 합성어','비통사적 합성어'];
    $b.innerHTML=`<span class="eyebrow">합성어 정밀 판정</span><h3>${it.parts.map(p=>p[0]).join(' + ')} → ${it.w}<br>우리말 문장의 배열 방식과 같을까요?</h3>
      <div class="opts" style="width:min(520px,100%)">
        <button class="opt" data-o="${opts[0]}">통사적 합성어<small>문장 배열과 같음</small></button>
        <button class="opt" data-o="${opts[1]}">비통사적 합성어<small>문장 배열과 다름</small></button></div>
      <div id="fb" style="width:100%"></div><div class="lockmsg" id="lock"></div>`;
    const btns=[...$b.querySelectorAll('.opt')];
    markTeacher(btns,b=>b.dataset.o===right);
    btns.forEach(b=>b.onclick=()=>{ if(b.dataset.o===right){hit(R,key);doneStage(`${right}예요. ${it.synTip}`)}
      else miss({room:R,key,chose:b.dataset.o,right,tip:it.synTip,btns,...fbs(),reveal:()=>btns.forEach(z=>z.dataset.o===right&&z.classList.add('reveal'))}) });
  };
  const doneStage=(more)=>{
    const it=items[qi];
    $b.innerHTML=`<div class="word">${it.parts.map(p=>`<span class="syl" style="border-radius:10px;margin:0 4px;border:1.5px solid var(--tag-line)">${p[0]}</span>`).join('<span style="align-self:center;font-size:28px;color:var(--amber)">+</span>')}</div>
      <div class="fb ok" style="width:100%">조립 완료: <b>${it.w}</b>는 <b>${it.cls}</b>예요. ${more?esc(more):esc(it.tip)}</div>
      <button class="btn" id="nx">${qi+1<items.length?'다음 부품':'조립 회로 켜기'}</button>`;
    const nx=document.getElementById('nx'); nx.onclick=next; nx.focus();
  };
  cutStage(); armHint(ROOM4.hint);
}

/* ===================== 5번 방: 새말 해독실(보너스) ===================== */
function renderRoom5(){
  renderBar(true);
  const R='5번 방';
  const items=shuffle([shuffle(ROOM5.blend)[0],shuffle(ROOM5.initial)[0],...ROOM5.refined]).slice(0,CONFIG.room5Pick);
  let qi=0;
  $app.innerHTML=`${roomHead(5,'암호처럼 들리는 새말을 해독하세요. 새말을 만든 재료 카드를 모두 고르고, 만든 방식을 판정하세요. 다듬은 말이라면 원래 어떤 외래어였는지도 맞혀야 합니다.')}
  <div class="counter" id="r5count"></div><div class="panel decoder" id="dec"></div>${hintBlock()}`;
  say(LINES.room[5]);
  const $d=document.getElementById('dec');
  const fbs=()=>({fb:document.getElementById('fb'),lock:document.getElementById('lock')});
  const cipher=w=>`<div class="cipher">${esc(w)}</div>`;
  const matStage=()=>{
    const it=items[qi], need=it.mat.length, sel=new Set(), key=`${it.w} 재료`;
    document.getElementById('r5count').textContent=`새말 ${qi+1} / ${items.length}`;
    $d.innerHTML=`${cipher(it.w)}<h3>이 새말의 재료 카드 <b>${need}장</b>을 고르세요.</h3>
      <div class="cards">${shuffle([...it.mat,...it.decoy]).map(c=>`<button class="card" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('')}</div>
      <button class="btn" id="chk" disabled>재료 확인 (0/${need})</button><div id="fb" style="width:100%"></div><div class="lockmsg" id="lock"></div>`;
    const cards=[...$d.querySelectorAll('.card')], chk=document.getElementById('chk');
    markTeacher(cards,c=>it.mat.includes(c.dataset.c));
    cards.forEach(c=>c.onclick=()=>{
      const v=c.dataset.c; if(sel.has(v)) sel.delete(v); else if(sel.size<need) sel.add(v);
      cards.forEach(x=>x.setAttribute('aria-pressed',sel.has(x.dataset.c))); sfx('flip');
      chk.disabled=sel.size!==need; chk.textContent=`재료 확인 (${sel.size}/${need})`;
    });
    chk.onclick=()=>{
      if(sel.size!==need) return;
      if(it.mat.every(m=>sel.has(m))){hit(R,key);howStage()}
      else{const chose=[...sel].join(', '); sel.clear(); cards.forEach(x=>x.setAttribute('aria-pressed','false')); chk.disabled=true; chk.textContent=`재료 확인 (0/${need})`;
        miss({room:R,key,chose,right:it.mat.join(', '),tip:'새말을 천천히 소리 내어 읽고, 각 글자가 어느 말에서 왔는지 따라가 보세요.',btns:cards,...fbs(),
          reveal:()=>cards.forEach(z=>it.mat.includes(z.dataset.c)&&z.classList.add('reveal'))})}
    };
  };
  const howStage=()=>{
    const it=items[qi], key=`${it.w} 만든 방식`;
    $d.innerHTML=`<div class="equation">${it.mat.map(esc).join(' + ')} → <em>${esc(it.w)}</em></div><h3>어떤 방식으로 만들어졌을까요?</h3>
      <div class="opts" style="width:100%">${HOWS.map(h=>`<button class="opt" data-o="${h.k}">${h.k}<small>${h.d}</small></button>`).join('')}</div>
      <div id="fb" style="width:100%"></div><div class="lockmsg" id="lock"></div>`;
    const btns=[...$d.querySelectorAll('.opt')];
    markTeacher(btns,b=>b.dataset.o===it.how);
    btns.forEach(b=>b.onclick=()=>{ if(b.dataset.o===it.how){hit(R,key); it.refine?refineStage():doneStage()}
      else miss({room:R,key,chose:b.dataset.o,right:it.how,tip:it.note,btns,...fbs(),reveal:()=>btns.forEach(z=>z.dataset.o===it.how&&z.classList.add('reveal'))}) });
  };
  const refineStage=()=>{
    const it=items[qi], x=it.refine, key=`${it.w} 다듬은 말`, right=x.opts[0];
    $d.innerHTML=`${cipher(it.w)}<span class="eyebrow">다듬은 말</span><h3>${x.q}</h3>
      <div class="opts" style="width:min(520px,100%)">${shuffle(x.opts).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>
      <div id="fb" style="width:100%"></div><div class="lockmsg" id="lock"></div>`;
    const btns=[...$d.querySelectorAll('.opt')];
    markTeacher(btns,b=>b.dataset.o===right);
    btns.forEach(b=>b.onclick=()=>{ if(b.dataset.o===right){hit(R,key);doneStage(`${right}를 쉬운 우리말로 다듬은 말이에요.`)}
      else miss({room:R,key,chose:b.dataset.o,right,tip:'\'누리\'는 \'세상\'이라는 뜻이에요. 인터넷 세상과 관련된 외래어를 떠올려 보세요.',btns,...fbs(),
        reveal:()=>btns.forEach(z=>z.dataset.o===right&&z.classList.add('reveal'))}) });
  };
  const doneStage=(more)=>{
    const it=items[qi];
    $d.innerHTML=`<div class="equation">${it.mat.map(esc).join(' + ')} → <em>${esc(it.w)}</em></div>
      <div class="fb ok" style="width:100%">해독 완료: <b>${esc(it.w)}</b>는 <b>${it.how}</b>(으)로 만든 새말이에요. ${esc(it.note)} ${more?esc(more):''}</div>
      <button class="btn" id="nx">${qi+1<items.length?'다음 새말':'해독 회로 켜기'}</button>`;
    const nx=document.getElementById('nx'); nx.focus(); nx.onclick=()=>{qi++; if(qi>=items.length) roomClear(5); else matStage()};
  };
  matStage(); armHint(ROOM5.hint);
}

/* ===================== 출입문 ===================== */
function renderDoor(){
  where='door'; renderBar(false); clearInterval(hintTimer);
  const R='출입문';
  const pieces=S.got.length===4?S.got.slice():PASS.pieces.slice(); // 선생님 모드에서 조각이 모자라면 전체 조각 사용
  const slots=[null,null,null,null]; let pick=null; const tray=shuffle(pieces);
  $app.innerHTML=`${onumHTML()}
  <div class="room-head"><div><span class="eyebrow">EXIT · 최종 잠금</span><h2>출입문</h2>
  <p class="mission">기억 조각을 눌러 고른 뒤 빈칸을 누르세요. 칸을 다시 누르면 조각이 돌아옵니다. 조각 네 개로 낱말 하나를 완성하세요.</p></div></div>
  <div class="panel bench" id="dz"></div>`;
  say(LINES.door);
  const $d=document.getElementById('dz');
  const fbs=()=>({fb:document.getElementById('fb'),lock:document.getElementById('lock')});
  const cur=()=>compose(slots[0],slots[1],slots[2])+(slots[3]?compose('ㅇ',slots[3],''):'');
  const draw=()=>{
    const slot=(i,lab,cls='')=>`<button class="slot ${slots[i]?'full':''} ${cls}" data-i="${i}">${slots[i]||`<small>${lab}</small>`}</button>`;
    $d.innerHTML=`<div class="preview" aria-live="polite">${slots.some(Boolean)?esc(cur()):'&nbsp;'}</div>
      <div class="slots">
        <div class="sylbox">${slot(0,'첫소리')}${slot(1,'가운뎃소리')}${slot(2,'끝소리','jong')}</div>
        <div class="sylbox"><span class="slot fixed" title="소리가 없는 자리">ㅇ</span>${slot(3,'가운뎃소리')}<span class="slot fixed jong"><small>끝소리 없음</small></span></div>
      </div>
      <div class="tray">${tray.map((p,i)=>p?`<button class="pc" data-t="${i}" aria-pressed="${pick===i}">${p}</button>`:'').join('')}</div>
      ${PREF.teacher?'<div class="ans">정답: 같이 (ㄱ ㅏ ㅌ / ㅇ ㅣ)</div>':''}
      <button class="btn" id="chk" ${slots.every(Boolean)?'':'disabled'}>비밀번호 입력</button>
      <div id="fb" style="width:100%"></div><div class="lockmsg" id="lock"></div>`;
    $d.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{pick=+b.dataset.t;sfx('flip');draw()});
    $d.querySelectorAll('.slot[data-i]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(slots[i]){const back=tray.findIndex(x=>x===null); tray[back]=slots[i]; slots[i]=null; draw(); return}
      if(pick==null) return; slots[i]=tray[pick]; tray[pick]=null; pick=null; sfx('flip'); draw();
    });
    const chk=document.getElementById('chk');
    chk.onclick=()=>{
      if(cur()===PASS.word){hit(R,'조각 조립');pronStage()}
      else{const tried=cur(); miss({room:R,key:'조각 조립',chose:tried,right:PASS.word,btns:[chk],...fbs(),
        tip:`온음: '${tried}'… 그런 낱말은 기억에 없어요. 자음과 모음 자리를 바꿔 보세요.`})}
    };
  };
  const pronStage=()=>{
    say(LINES.door2);
    $d.innerHTML=`<div class="preview">같이</div><h3>출입문 음성 인식: 어떻게 소리 내야 할까요?</h3>
      <div class="opts" style="width:min(520px,100%)">${shuffle(PASS.pron).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div><div id="fb" style="width:100%"></div><div class="lockmsg" id="lock"></div>`;
    const btns=[...$d.querySelectorAll('.opt')], right=PASS.pron[0];
    markTeacher(btns,b=>b.dataset.o===right);
    btns.forEach(b=>b.onclick=()=>{ if(b.dataset.o===right){hit(R,'같이 발음');chgStage()}
      else miss({room:R,key:'같이 발음',chose:b.dataset.o,right,btns,...fbs(),tip:'받침 ㅌ 뒤에 모음 ㅣ로 시작하는 조사 \'이\'가 왔어요. 2번 방의 \'굳이\'를 떠올려 보세요.',
        reveal:()=>btns.forEach(z=>z.dataset.o===right&&z.classList.add('reveal'))}) });
  };
  const chgStage=()=>{
    $d.innerHTML=`<div class="preview">[가치]</div><h3>마지막 확인: 어떤 음운 변동 덕분에 문이 열리나요?</h3>
      <div class="opts" style="width:min(520px,100%)">${shuffle(PASS.chg).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div><div id="fb" style="width:100%"></div><div class="lockmsg" id="lock"></div>`;
    const btns=[...$d.querySelectorAll('.opt')], right=PASS.chg[0];
    markTeacher(btns,b=>b.dataset.o===right);
    btns.forEach(b=>b.onclick=()=>{ if(b.dataset.o===right){hit(R,'같이 변동 이름');renderEscape()}
      else miss({room:R,key:'같이 변동 이름',chose:b.dataset.o,right,btns,...fbs(),tip:'ㅌ이 ㅣ를 만나 입천장소리 ㅊ으로 바뀌었어요.',
        reveal:()=>btns.forEach(z=>z.dataset.o===right&&z.classList.add('reveal'))}) });
  };
  draw();
}

/* ===================== 탈출과 기록 ===================== */
function renderEscape(){
  pauseClock(); const total=elapsed(); where='end'; renderBar(false); clearSave(); sfx('door');
  const byItem={}; S.wrongs.forEach(w=>{const k=w.room+'|'+w.item;(byItem[k]=byItem[k]||{...w,n:0}).n++});
  const top=Object.values(byItem).sort((a,b)=>b.n-a.n);
  const who=S.mode==='pair'?S.names.join(' · '):S.names[0];
  const d=new Date(), date=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
  const rooms=['1번 방','2번 방','3번 방','4번 방','5번 방','출입문'];
  const label={'1번 방':'소리 보관실','2번 방':'발음 복구실','3번 방':'품사 보안실','4번 방':'단어 조립실','5번 방':'새말 해독실','출입문':'출입문'};
  const rates=rooms.filter(r=>S.stats[r]).map(r=>{const st=S.stats[r],p=Math.round(st.first/st.q*100);
    return `<div class="rate"><span>${label[r]}</span><span class="track"><span class="fill" style="width:${p}%;display:block"></span></span><span>${p}%</span></div>`}).join('');
  $app.innerHTML=`<div class="doors" id="doors"><div class="d l"></div><div class="d r"></div></div>
  ${onumHTML()}
  <div class="cert">
    <span class="seal">${S.bonus?'보너스<br>달성':'복구<br>완료'}</span>
    <small>언어 연구소 · 탈출 증명서</small>
    <h3>${esc(who)} 연구원</h3>
    <span>위 연구원은 정전으로 꺼진 언어 회로 네 개를 되살리고 비밀번호 [가치]로 출입문을 열었음을 증명합니다.${S.bonus?' 또한 보너스 새말 해독실까지 복구하였습니다.':''}</span>
    <span class="term" style="font-size:14px">${date} · 탈출 기록 ${fmt(total)} · ${S.diff==='hard'?'도전 복습':'처음 복습'}${PREF.teacher?' · 선생님 모드':''}</span>
  </div>
  <p class="muted" style="margin:0 0 6px">이 증명서와 아래 기록을 캡처해서 제출하세요.</p>
  <div class="stats">
    <div class="stat"><small>탈출 기록 (힌트 벌점 포함)</small><b>${fmt(total)}</b></div>
    <div class="stat"><small>힌트 · 도움</small><b>${S.hints} · ${S.helps}회</b></div>
    <div class="stat"><small>연구 노트 열람</small><b>${S.notes}회</b></div>
    <div class="stat"><small>낫·낮 함정</small><b>${S.trapFound?'판정 성공':'놓침'}</b></div>
    <div class="stat"><small>보너스 새말 해독실</small><b>${S.bonus?'−'+CONFIG.bonusSec+'초 획득':'도전 안 함'}</b></div>
  </div>
  <div class="panel" style="display:grid;gap:10px;margin-bottom:14px"><h3 style="font-size:24px">방별 첫 시도 정답률</h3>${rates||'<p class="muted">기록이 없어요.</p>'}</div>
  <div class="panel" style="margin-bottom:14px"><h3 style="font-size:24px;margin-bottom:8px">다시 볼 문제</h3>
    ${top.length?`<div class="tblwrap"><table class="log"><thead><tr><th>방</th><th>문제</th><th>고른 답</th><th>정답</th><th>틀린 횟수</th></tr></thead><tbody>
      ${top.map(w=>`<tr><td>${label[w.room]||w.room}</td><td>${esc(w.item)}</td><td>${esc(w.chose)}</td><td>${esc(w.right)}</td><td>${w.n}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">한 번도 틀리지 않았어요.</p>'}
  </div>
  <div class="panel"><h3 style="font-size:24px;margin-bottom:8px">함께 생각해 볼 질문</h3><ol class="debrief">${DEBRIEF.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div>
  <div style="margin-top:16px"><button class="btn ghost" id="again">처음 화면으로</button></div>`;
  say(LINES.end);
  setTimeout(()=>document.getElementById('doors').classList.add('opened'),200);
  document.getElementById('again').onclick=renderStart;
}

document.documentElement.classList.toggle('big',PREF.big);
renderStart();
</script>

</body>
</html>
